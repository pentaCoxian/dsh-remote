[package]
name = "dshr_pipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "DSH Remote phone transport: dials a host's iroh ticket and serves it on an app-private Unix socket"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# No fast-apple-datapath (private Apple API), portmapper or metrics on a phone.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
serde_json = "1"
# libc 0.2.191 drops Apple definitions on iOS that netwatch and netdev use (RTAX_*,
# in6_ifreq), so neither builds for aarch64-apple-ios. 0.2.189 is what netwatch 0.19.3
# was locked against.
libc = "=0.2.189"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

