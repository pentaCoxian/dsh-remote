name: dsh_remote
description: "Native remote control for DeepSeek Harness"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  dio: ^5.7.0
  ffi: ^2.1.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  lucide_icons_flutter: ^4.0.1
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # The web screen's tests stand in for the WebView.
  webview_flutter_platform_interface: ^2.14.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
