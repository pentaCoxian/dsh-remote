name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Plugin, gateway and protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Real DSH (dsh web 0.2.1-rc.3, scripted model)
        run: pnpm --filter @dsh-remote/dsh-plugin test:dsh
      - name: Release tarballs
        run: |
          pnpm --filter @dsh-remote/dsh-plugin pack:release
          pnpm --filter @dsh-remote/push-gateway pack:release
      - name: Install the plugin tarball into DSH and run it
        timeout-minutes: 10
        run: pnpm --filter @dsh-remote/dsh-plugin smoke:release "$PWD/packages/dsh-plugin/release/dsh-remote-dsh-plugin-$(node -p "require('./packages/dsh-plugin/package.json').version").tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: release-tarballs
          path: |
            packages/dsh-plugin/release/*.tgz
            packages/dsh-plugin/release/install.mjs
            packages/push-gateway/release/*.tgz
          retention-days: 14

  native:
    name: Rust pipe and Flutter app
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The interop and Dart end-to-end tests run the plugin's iroh fixture host.
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/native/dshr_pipe
      - name: Rust pipe tests, with the Node interop test
        working-directory: apps/mobile/native/dshr_pipe
        run: DSHR_INTEROP_NODE="$(which node)" cargo test
      - name: Build the pipe library for the Dart end-to-end test
        working-directory: apps/mobile/native/dshr_pipe
        run: cargo build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get && flutter analyze
      - name: Flutter tests, with the pipe end to end over FFI
        working-directory: apps/mobile
        run: DSHR_PIPE_LIB="$PWD/native/dshr_pipe/target/debug/libdshr_pipe.so" DSHR_FIXTURE_NODE="$(which node)" flutter test

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, as for TestFlight builds.
          fetch-depth: 0
      - run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/native/dshr_pipe
          key: android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: The pipe for each Android ABI
        run: apps/mobile/native/build.sh android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
          cache: true
      - name: Release APK, signed with the project's key
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf %s "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::a release APK must be signed with the project's key (ANDROID_KEYSTORE_* secrets)"
            exit 1
          else
            echo "::warning::no signing secrets (a fork's pull request?): this APK is signed with the runner's debug key"
          fi
          build=$(git rev-list --count HEAD)
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          flutter build apk --release --build-number "$build"
          mkdir -p "$RUNNER_TEMP/apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/apk/dsh-remote-$version-$build.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          retention-days: 14
